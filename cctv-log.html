<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>NVR Camera Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an NVR "channel board" — verdict band, timeline, then evidence and fixes in one readable column */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#15212b; --ink-2:#4a5965; --ink-3:#7b8a96;
  --line:#dde3e8; --line-2:#c6d0d8; --accent:#1f5f8b; --accent-soft:#e3eef6;
  --good:#0ca30c; --good-ink:#006300; --good-soft:#e4f4e4;
  --crit:#d03b3b; --crit-ink:#b02a2a; --crit-soft:#fbe7e7;
  --warn:#fab219; --warn-soft:#fdf2d8; --warn-ink:#7a5300;
  --idle:#d9dfe4;
  --f-display:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171c; --panel:#192127; --ink:#e7edf2; --ink-2:#a9b6c0; --ink-3:#7d8b96;
  --line:#26313a; --line-2:#36434e; --accent:#7fb6dd; --accent-soft:#1d3242;
  --good-ink:#3fc23f; --good-soft:#163019; --crit-ink:#f08080; --crit-soft:#3a1f22;
  --warn-soft:#3a3018; --warn-ink:#f5c860; --idle:#2c3740; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --panel:#192127; --ink:#e7edf2; --ink-2:#a9b6c0; --ink-3:#7d8b96;
  --line:#26313a; --line-2:#36434e; --accent:#7fb6dd; --accent-soft:#1d3242;
  --good-ink:#3fc23f; --good-soft:#163019; --crit-ink:#f08080; --crit-soft:#3a1f22;
  --warn-soft:#3a3018; --warn-ink:#f5c860; --idle:#2c3740; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.top .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.btn{font:inherit;font-size:.95rem;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop-hint{font-size:.82rem;color:var(--ink-3)}
.loaded{font-size:.85rem;color:var(--ink-2)}

/* verdict */
.verdict{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.verdict-head{display:flex;gap:14px;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line)}
.verdict.bad .verdict-head{background:var(--crit-soft)}
.verdict.ok .verdict-head{background:var(--good-soft)}
.lamp{flex:none;width:14px;height:14px;border-radius:50%;margin-top:9px;background:var(--crit);box-shadow:0 0 0 4px color-mix(in srgb,var(--crit) 25%,transparent)}
.verdict.ok .lamp{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.verdict.bad .lamp{animation:blink 1.6s ease-in-out infinite}}
@keyframes blink{50%{opacity:.35}}
.verdict-head .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.verdict-head h2{font-size:clamp(1.2rem,3vw,1.55rem)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr)}
.tile{padding:16px 22px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.tile:last-child{border-right:0}
.tile .v{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{font-size:.88rem;color:var(--ink-2)}
@media (max-width:720px){.tiles{grid-template-columns:1fr 1fr}.tile:nth-child(2){border-right:0}.tile:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* sections */
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}

/* chart */
.chart-wrap{position:relative}
.chart-scroll{overflow-x:auto}
svg.chart{display:block;width:100%;min-width:560px;height:auto}
svg.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--ink-3)}
svg.chart .lbl-strong{fill:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.88rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.85rem;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* cycle */
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:step}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.step .n{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.step.fail{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.step .raw{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
@media (max-width:760px){.cycle{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.cycle{grid-template-columns:1fr}}
.loopnote{font-size:.92rem;color:var(--ink-2)}

/* evidence */
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.ev-grid{grid-template-columns:1fr}}
.ev{display:flex;flex-direction:column;gap:10px;min-width:0}
.ev ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;font-family:var(--f-display)}
.chip.c{background:var(--crit-soft);color:var(--crit-ink)}
.chip.g{background:var(--good-soft);color:var(--good-ink)}
.chip.w{background:var(--warn-soft);color:var(--warn-ink)}
.chip.a{background:var(--accent-soft);color:var(--accent)}

/* checklist */
ol.fix{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:fx}
ol.fix li{counter-increment:fx;display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
ol.fix li::before{content:counter(fx);font-family:var(--f-mono);font-weight:500;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.9rem}
ol.fix .body{display:flex;flex-direction:column;gap:4px;min-width:0}
ol.fix .result{font-size:.9rem;color:var(--ink-2)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:.82rem;color:var(--ink-2);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:.95rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
details[open] summary{margin-bottom:10px}
.tl-list{font-family:var(--f-mono);font-size:.85rem;columns:4 120px;column-gap:16px;color:var(--ink-2)}
.note{font-size:.88rem;color:var(--ink-2);border-left:3px solid var(--warn);padding:6px 12px;background:var(--warn-soft);border-radius:0 8px 8px 0}
footer{font-size:.82rem;color:var(--ink-3)}
</style>
<style>
.ev-grid{grid-template-columns:1fr 1fr 1fr}
@media (max-width:820px){.ev-grid{grid-template-columns:1fr}}
.ev ul{list-style:none;padding:0;gap:6px}
.ev li{font-size:.95rem}
.step h3{font-size:1rem}
.step .raw{font-size:.75rem}
.files{font-size:.82rem;color:var(--ink-3)}
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
#file:focus-visible+label.btn{outline:2px solid var(--accent);outline-offset:2px}
label.btn{display:inline-flex;align-items:center;user-select:none}
.chname{font-family:var(--f-mono);font-size:.95rem;padding:7px 4px}
.seq{display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seq-row{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.seq-row:last-child{border-bottom:0}
.seq-row .off{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.9rem}
.seq-row .ev{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-width:0}
.seq-row .ev b{font-weight:600}
.seq-row .ev span{font-size:.88rem;color:var(--ink-2)}
.seq-row.fail{background:var(--crit-soft)}
.seq-row.loop .off{color:var(--accent)}
</style>
<div class="wrap" id="app">
  <header class="top">
    <div class="title">
      <span class="eyebrow" id="srcLine">NVR LOG</span>
      <h1 id="h1">รายงานกล้อง</h1>
    </div>
    <div class="controls">
      <label for="cam" class="small muted" id="camLbl">ช่อง</label>
      <select id="cam"></select>
      <span class="chname" id="camOne" hidden></span>
      <input type="file" id="file" multiple>
      <label class="btn" for="file" id="pick">เปิดไฟล์ Log (.csv)</label>
    </div>
  </header>

  <div class="verdict" id="verdict">
    <div class="verdict-head">
      <span class="lamp" aria-hidden="true"></span>
      <div class="txt">
        <h2 id="vTitle"></h2>
        <p class="muted" id="vSub"></p>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>

  <section>
    <div class="sec-head"><h2>ไทม์ไลน์</h2></div>
    <div class="panel">
      <div class="legend" style="margin-bottom:10px">
        <span><i class="sw" style="background:var(--good)"></i>บันทึกปกติ</span>
        <span><i class="sw" style="background:var(--crit)"></i>ไม่มีภาพ</span>
        <span class="small">แท่ง = ครั้งที่หลุดต่อ 10 นาที</span>
      </div>
      <div class="chart-wrap">
        <div class="chart-scroll"><svg class="chart" id="chart" role="img" aria-label="ไทม์ไลน์การหลุดของกล้อง"></svg></div>
        <div class="tip" id="tip"></div>
      </div>
    </div>
    <p class="note" id="capNote" hidden></p>
  </section>

  <section id="cycleSec">
    <div class="sec-head"><h2>อาการที่วนซ้ำ</h2><p class="muted small" id="cycleSub"></p></div>
    <div class="seq" id="cycle"></div>
  </section>

  <section>
    <div class="sec-head"><h2>ใช่พอร์ต PoE ไหม?</h2></div>
    <div class="ev-grid" id="evidence"></div>
  </section>

  <section>
    <div class="sec-head"><h2>รายชั่วโมง</h2></div>
    <div class="tbl-wrap"><table id="hourTbl"></table></div>
  </section>

  <section>
    <div class="two">
      <div class="panel"><h3 style="margin-bottom:10px">กล้อง</h3><dl class="kv" id="camInfo"></dl></div>
      <div class="panel"><h3 style="margin-bottom:10px">ฮาร์ดดิสก์ NVR</h3><dl class="kv" id="hddInfo"></dl></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>เหตุการณ์อื่น</h2></div>
    <div class="tbl-wrap"><table id="otherTbl"></table></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const hms=d=>hm(d)+":"+pad(d.getSeconds());
const CYC=new Set(["เริ่มบันทึกทันที","หยุดบันทึก","กล้องไอพีขาดการเชื่อมต่อ","สถานะการเชื่อมต่อกล้อง IP","การเชื่อมต่อ ipc"]);
const dmy=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
const fmtNum=n=>n.toLocaleString("th-TH");
function dur(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?`${h} ชม. ${m} น.`:`${m} นาที`;}

/* ---------- CSV ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f="";}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=""; if(row.length>1||row[0]!=="")rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
function parseTime(s){
  s=(s||"").trim();
  let m=/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(s);
  if(m)return {t:new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)),sec:m[6]!=null};
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(s);
  if(!m)return null;
  let y=+m[3]; if(y>2400)y-=543;
  return {t:new Date(y,+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)),sec:m[6]!=null};
}
function parseDash(s){
  const m=/(\d{2})-(\d{2})-(\d{4}) (\d{2}):(\d{2}):(\d{2})/.exec(s||""); if(!m)return null;
  return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]);
}
/* merge several exported files: files with seconds win; rows inside an already-covered time range are dropped as duplicates */
function mergeFiles(files){
  files.forEach(F=>{
    F.rows=F.raw.map(r=>{const p=parseTime(r[0]);return p&&r.length>=7?{t:p.t,sec:p.sec,main:r[1],sub:r[2],ch:r[3],user:r[4],ip:r[5],d:r[6]||""}:null;}).filter(Boolean).sort((a,b)=>a.t-b.t);
    F.sec=F.rows.some(r=>r.sec);
  });
  const use=files.filter(F=>F.rows.length).sort((a,b)=>(b.sec-a.sec)||(a.rows[0].t-b.rows[0].t));
  const cov=[],out=[];
  use.forEach(F=>{
    F.rows.forEach(r=>{if(!cov.some(([a,b])=>r.t>=a&&r.t<=b))out.push(r);});
    const s=new Date(F.rows[0].t);s.setSeconds(0,0);cov.push([s,F.rows[F.rows.length-1].t]);
  });
  out.sort((a,b)=>a.t-b.t);
  const last=use.slice().sort((a,b)=>b.rows[b.rows.length-1].t-a.rows[a.rows.length-1].t)[0];
  return {rows:out,meta:{files:use.length,lastCapped:!!last&&last.n>=2000}};
}

/* ---------- analysis ---------- */
let ROWS=[],META={},SRC="";
function load(rows,meta,src){
  ROWS=rows;META=meta;SRC=src;
  const cnt={};
  ROWS.forEach(r=>{if(r.sub.includes("ขาดการเชื่อมต่อ")&&r.ch)cnt[r.ch]=(cnt[r.ch]||0)+1;});
  const chans=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const sel=$("cam"),prev=sel.value;
  sel.innerHTML="";
  if(!chans.length)chans.push("D12");
  chans.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c+(cnt[c]?` (หลุด ${fmtNum(cnt[c])})`:"");sel.appendChild(o);});
  sel.value=chans.includes(prev)?prev:chans[0];
  const one=chans.length===1;
  sel.hidden=one;$("camOne").hidden=!one;$("camOne").textContent=chans[0]+(cnt[chans[0]]?` · หลุด ${fmtNum(cnt[chans[0]])} ครั้ง`:"");
  render(sel.value);
}

function analyze(ch){
  const n=parseInt(ch.replace(/\D/g,""),10);
  const t0=ROWS[0].t,t1=ROWS[ROWS.length-1].t;
  const camNoRe=new RegExp("หมายเลขกล้อง:\\s*"+n+"(\\D|$)");
  const disc=ROWS.filter(r=>r.ch===ch&&r.sub.includes("ขาดการเชื่อมต่อ"));
  const reasons={};disc.forEach(r=>{const m=/ข้อมูลเพิ่มเติม:\s*(.*)/.exec(r.d);const k=m?m[1].trim():"(ไม่ระบุ)";reasons[k]=(reasons[k]||0)+1;});
  const reconn=ROWS.filter(r=>r.sub.includes("สถานะการเชื่อมต่อกล้อง")&&camNoRe.test(r.d));
  const ipc=ROWS.filter(r=>r.sub.toLowerCase().includes("ipc")&&camNoRe.test(r.d)&&/รุ่นกล้อง/.test(r.d));
  const playErr=ROWS.find(r=>r.sub==="ระบบทำงานอยู่"&&new RegExp("หมายเลขกล้อง:\\s*"+ch+"\\b").test(r.d));
  const dfull=disc.find(r=>/ที่อยู่ IP/.test(r.d));
  let ip="",proto="",port="";
  if(dfull){const d=dfull.d;ip=(/ที่อยู่ IP:\s*(\S+)/.exec(d)||[])[1]||"";proto=(/โปรโตคอล:\s*(\S+)/.exec(d)||[])[1]||"";port=(/พอร์ตการจัดการ:\s*(\S+)/.exec(d)||[])[1]||"";}
  const info={};
  if(ipc.length){const d=ipc[ipc.length-1].d;info.model=(/รุ่นกล้อง IP:\s*(.*)/.exec(d)||[])[1];info.fw=(/เวอร์ชันกล้อง IP:\s*(.*)/.exec(d)||[])[1];info.sn=(/ซีเรียลของกล้อง IP:\s*(.*)/.exec(d)||[])[1];}
  const rec=[];const lineRe=new RegExp("^"+ch+" Len: (\\d+) R: (\\d+) W: (\\d+) Time: (.+)$","m");
  ROWS.forEach(r=>{if(r.sub!=="ระบบทำงานอยู่")return;const m=lineRe.exec(r.d);if(m)rec.push({t:r.t,last:parseDash(m[4])});});
  rec.forEach(x=>{x.stale=x.last&&(x.t-x.last)>5*60000;});
  const lastRec=rec[rec.length-1];
  const stoppedAt=lastRec&&lastRec.stale?lastRec.last:null;
  const mins=Math.max(1,Math.floor((t1-t0)/60000)+1);
  const discMin=new Map();
  disc.forEach(r=>{const i=Math.floor((r.t-t0)/60000);discMin.set(i,(discMin.get(i)||0)+1);});
  const status=new Array(mins).fill("ok");
  const idx=[...discMin.keys()].sort((a,b)=>a-b);const eps=[];
  idx.forEach(i=>{const e=eps[eps.length-1];if(e&&i-e.end<=5)e.end=i;else eps.push({start:i,end:i});});
  eps.forEach(e=>{for(let i=e.start;i<=e.end;i++)status[i]="bad";});
  if(stoppedAt){for(let i=Math.max(0,Math.floor((stoppedAt-t0)/60000));i<mins;i++)status[i]="bad";}
  const ongoing=disc.length&&(t1-disc[disc.length-1].t)<=5*60000;
  const firstBad=stoppedAt?(disc.length?new Date(Math.min(stoppedAt,disc[0].t)):stoppedAt):(disc[0]?disc[0].t:null);
  // cycle from second-resolution rows only
  const ds=disc.filter(r=>r.sec);let cycleSec=null;
  if(ds.length>2){const g=[];for(let i=1;i<ds.length;i++){const x=(ds[i].t-ds[i-1].t)/1000;if(x>0&&x<120)g.push(x);}g.sort((a,b)=>a-b);cycleSec=g[Math.floor(g.length/2)];}
  else if(disc.length>1)cycleSec=(disc[disc.length-1].t-disc[0].t)/1000/(disc.length-1);
  let badMin=status.filter(s=>s==="bad").length;
  if(stoppedAt)badMin=Math.round((t1-stoppedAt)/60000)+eps.filter(e=>t0.getTime()+e.end*60000<stoppedAt).reduce((a,e)=>a+e.end-e.start+1,0);
  // other channels from the latest per-channel stats row
  const lastStats=[...ROWS].reverse().find(r=>r.sub==="ระบบทำงานอยู่"&&/^D1 Len/m.test(r.d));
  let othersOk=0,othersBad=[];
  if(lastStats){lastStats.d.split("\n").forEach(l=>{const m=/^(D\d+) Len: (\d+).*Time: (.+)$/.exec(l);if(!m||m[1]===ch)return;const lt=parseDash(m[3]);if(!lt||lt.getFullYear()<2000)return;if(lastStats.t-lt<=5*60000)othersOk++;else othersBad.push(m[1]);});}
  // one real cycle (second-resolution rows): from a record start to the next record start
  let sample=null;
  const evs=ROWS.filter(r=>r.sec&&CYC.has(r.sub)&&(r.ch===ch||camNoRe.test(r.d)));
  for(let i=0;i<evs.length&&!sample;i++){
    if(evs[i].sub!=="เริ่มบันทึกทันที")continue;
    const seq=[evs[i]];
    for(let j=i+1;j<evs.length&&j<i+8;j++){seq.push(evs[j]);if(evs[j].sub==="เริ่มบันทึกทันที")break;}
    if(seq.length>=4&&seq[seq.length-1].sub==="เริ่มบันทึกทันที"&&seq.some(r=>r.sub.includes("ขาดการเชื่อมต่อ")))sample=seq;
  }
  return {othersOk,othersBad,sample,ch,n,t0,t1,disc,reasons,reconn,ip,proto,port,info,stoppedAt,status,ongoing,firstBad,cycleSec,badMin,playErr,mins};
}

/* ---------- render ---------- */
function render(ch){
  if(!ROWS.length)return;
  const A=analyze(ch);
  $("srcLine").textContent=`NVR LOG · ${dmy(A.t0)} · ${hm(A.t0)}–${hm(A.t1)} · ${META.files||1} ไฟล์`;
  $("h1").textContent=`รายงานกล้อง ${ch}`;
  document.title=`รายงานกล้อง ${ch}`;
  const bad=A.disc.length>0||!!A.stoppedAt;
  $("verdict").className="verdict "+(bad?"bad":"ok");
  if(bad){
    $("vTitle").textContent=A.stoppedAt?`${ch} ไม่บันทึกภาพตั้งแต่ ${hms(A.stoppedAt)} น.`:`${ch} หลุดเป็นช่วงๆ เริ่ม ${hm(A.firstBad)} น.`;
    $("vSub").textContent=A.ongoing?`ยังเป็นอยู่ถึง ${hms(A.t1)} น. (รายการสุดท้ายของ log)`:`หลุดครั้งสุดท้าย ${hm(A.disc[A.disc.length-1].t)} น.`;
  }else{
    $("vTitle").textContent=`${ch} ปกติ`;
    $("vSub").textContent="ไม่พบการหลุดในช่วง log นี้";
  }
  const tiles=[
    [A.badMin?dur(A.badMin):"0","ไม่มีภาพ"],
    [fmtNum(A.disc.length),"ครั้งที่หลุด"],
    [A.cycleSec?`${Math.round(A.cycleSec)} วิ`:"–","หลุดซ้ำทุก"],
    [A.disc.length?fmtNum(A.reconn.length):"–","เชื่อมต่อกลับ"]
  ];
  $("tiles").innerHTML=tiles.map(([v,k])=>`<div class="tile"><span class="v">${esc(v)}</span><span class="k">${esc(k)}</span></div>`).join("");
  $("capNote").hidden=!META.lastCapped;
  $("capNote").textContent=`ไฟล์ล่าสุดมีครบ 2,000 รายการ (จำนวนสูงสุดต่อการส่งออก) จึงอาจมีข้อมูลหลัง ${hm(A.t1)} น. ที่ยังไม่ได้ส่งออก`;
  drawChart(A);renderCycle(A);renderEvidence(A);renderHours(A);renderInfo(A);renderOther(A);
  $("foot").textContent=`ที่มา: ${SRC} · ${fmtNum(ROWS.length)} รายการหลังตัดซ้ำ · ไฟล์ถูกอ่านในเบราว์เซอร์เท่านั้น`;
}

function drawChart(A){
  const svg=$("chart");
  const W=960,padL=34,padR=12,stripY=18,stripH=22,barTop=64,barH=110,axisY=barTop+barH,H=axisY+28;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const iw=W-padL-padR,totalMin=A.mins,x=m=>padL+iw*m/totalMin;
  const bins=Math.ceil(totalMin/10),counts=new Array(bins).fill(0);
  A.disc.forEach(r=>{counts[Math.min(bins-1,Math.floor((r.t-A.t0)/600000))]++;});
  const maxC=Math.max(4,...counts),step=maxC<=8?2:maxC<=20?5:10,top=Math.ceil(maxC/step)*step;
  const y=v=>axisY-barH*v/top;
  let s="",i=0;
  while(i<totalMin){let j=i;while(j<totalMin&&A.status[j]===A.status[i])j++;
    s+=`<rect x="${x(i).toFixed(1)}" y="${stripY}" width="${Math.max(1,x(j)-x(i)).toFixed(1)}" height="${stripH}" fill="var(--${A.status[i]==="bad"?"crit":"good"})"/>`;i=j;}
  s+=`<text x="${padL-6}" y="${stripY+15}" text-anchor="end" class="lbl-strong">REC</text>`;
  for(let v=0;v<=top;v+=step){s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
  const bw=iw/bins;
  counts.forEach((c,k)=>{
    const bx=padL+k*bw+1,w=Math.max(1,bw-2);
    if(c>0){const h=axisY-y(c),r=Math.min(3,w/2);s+=`<path d="M${bx},${axisY} v${-(h-r)} q0,-${r} ${r},-${r} h${Math.max(0,w-2*r)} q${r},0 ${r},${r} v${h-r} z" fill="var(--crit)"/>`;}
    s+=`<rect class="hit" data-k="${k}" data-c="${c}" x="${padL+k*bw}" y="${barTop-6}" width="${bw}" height="${barH+6}" fill="transparent"/>`;
  });
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${axisY}" y2="${axisY}" stroke="var(--line-2)"/>`;
  const hrs=(A.t1-A.t0)/3600000,every=hrs>12?2:1;
  const st=new Date(A.t0);st.setMinutes(0,0,0);
  for(let t=new Date(st);t<=A.t1;t=new Date(t.getTime()+3600000)){
    const m=(t-A.t0)/60000;if(m<0||t.getHours()%every)continue;
    s+=`<line x1="${x(m)}" x2="${x(m)}" y1="${axisY}" y2="${axisY+5}" stroke="var(--line-2)"/><text x="${x(m)}" y="${axisY+18}" text-anchor="middle">${pad(t.getHours())}:00</text>`;
  }
  if(A.firstBad){const m=(A.firstBad-A.t0)/60000;s+=`<line x1="${x(m)}" x2="${x(m)}" y1="${stripY-4}" y2="${axisY}" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text x="${Math.min(x(m)+5,W-110)}" y="${stripY-6}" class="lbl-strong">${A.stoppedAt?hms(A.stoppedAt):hm(A.firstBad)}</text>`;}
  svg.innerHTML=s;
  const tip=$("tip"),wrap=svg.parentNode.parentNode;
  svg.querySelectorAll(".hit").forEach(r=>{
    const show=()=>{const k=+r.dataset.k,a=new Date(A.t0.getTime()+k*600000),b=new Date(a.getTime()+600000);tip.textContent=`${hm(a)}–${hm(b)} · หลุด ${r.dataset.c} ครั้ง`;tip.classList.add("on");};
    r.addEventListener("pointerenter",show);
    r.addEventListener("pointerdown",e=>{show();const bb=wrap.getBoundingClientRect();tip.style.left=(e.clientX-bb.left)+"px";tip.style.top=(e.clientY-bb.top)+"px";});
    r.addEventListener("pointermove",e=>{const bb=wrap.getBoundingClientRect();tip.style.left=(e.clientX-bb.left)+"px";tip.style.top=(e.clientY-bb.top)+"px";});
    r.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")tip.classList.remove("on");});
  });
}

function renderCycle(A){
  const sec=$("cycleSec");
  if(!A.disc.length){sec.hidden=true;return;}sec.hidden=false;
  const reason=(Object.keys(A.reasons)[0]||"").replace(/^.*--\s*/,"");
  const note=r=>{
    if(r.sub.includes("ขาดการเชื่อมต่อ"))return reason;
    if(r.sub.includes("สถานะการเชื่อมต่อกล้อง"))return (/สถานะกล้อง:\s*(.*)/.exec(r.d)||[])[1]||"";
    if(r.sub.includes("ipc"))return A.info.model?`อ่านรุ่น ${A.info.model} ได้`:"";
    return "";
  };
  let rows;
  if(A.sample){
    const s0=A.sample[0].t;
    rows=A.sample.map((r,i)=>{const off=Math.round((r.t-s0)/1000);const last=i===A.sample.length-1;
      return `<div class="seq-row${r.sub.includes("ขาดการเชื่อมต่อ")||r.sub==="หยุดบันทึก"?" fail":""}${last?" loop":""}"><span class="off">${last?"↻ ":""}+${off} วิ</span><div class="ev"><b>${esc(r.sub)}</b><span>${esc(last?"วนรอบใหม่":note(r))}</span></div></div>`;});
    $("cycleSub").textContent=`ตัวอย่างจริงจาก log เวลา ${hms(s0)} น. · ซ้ำ ${fmtNum(A.disc.length)} รอบ`;
  }else{
    rows=["เริ่มบันทึกทันที","หยุดบันทึก","กล้องไอพีขาดการเชื่อมต่อ","สถานะการเชื่อมต่อกล้อง IP","การเชื่อมต่อ ipc"].map(s=>`<div class="seq-row${/หยุด|ขาด/.test(s)?" fail":""}"><span class="off">–</span><div class="ev"><b>${esc(s)}</b><span>${esc(s.includes("ขาด")?reason:"")}</span></div></div>`);
    $("cycleSub").textContent=`ซ้ำ ${fmtNum(A.disc.length)} รอบ`;
  }
  $("cycle").innerHTML=rows.join("");
}

function renderEvidence(A){
  const internal=/^192\.168\.254\./.test(A.ip);
  const back=A.sample?(()=>{const d=A.sample.find(r=>r.sub.includes("ขาดการเชื่อมต่อ")),c=A.sample.find(r=>r.sub.includes("สถานะการเชื่อมต่อกล้อง"));return d&&c?Math.round((c.t-d.t)/1000):null;})():null;
  const reason=(Object.keys(A.reasons)[0]||"").replace(/^.*--\s*/,"");
  const card=(chip,cls,items)=>`<div class="panel ev"><span><span class="chip ${cls}">${chip}</span></span><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  const span=A.firstBad?`${A.stoppedAt?hm(A.stoppedAt):hm(A.firstBad)} → ${hm(A.t1)} ไม่หายเอง`:"";
  $("evidence").innerHTML=
    card("เข้าทาง PoE","w",[
      internal?`IP <span class="mono small">${esc(A.ip)}</span> = วงพอร์ต PoE หลัง NVR`:`IP <span class="mono small">${esc(A.ip||"-")}</span>`,
      span,
      A.othersOk?`ช่องอื่น ${A.othersOk} ช่องบันทึกปกติ${A.othersBad.length?` (ยกเว้น ${esc(A.othersBad.join(", "))})`:""}`:""
    ].filter(Boolean))+
    card("เข้าทางกล้องค้าง","a",[
      back!=null?`หลุดแล้วเชื่อมต่อกลับใน ${back} วิ`:"NVR เชื่อมต่อกลับได้ทุกรอบ",
      A.info.model?`อ่านรุ่น/ซีเรียลกล้องได้ทุกรอบ`:"",
      reason?`สาเหตุใน log: <span class="mono small">${esc(reason)}</span>`:""
    ].filter(Boolean))+
    card("สรุป","c",[`กล้องยังตอบ NVR แต่ไม่ส่งภาพ`,`ต้นเหตุอยู่ที่ <strong>กล้อง</strong>, <strong>สาย</strong> หรือ <strong>พอร์ต</strong> ของ ${esc(A.ch)}`]);
}

function renderHours(A){
  const h={};
  for(let i=0;i<A.mins;i++){const k=new Date(A.t0.getTime()+i*60000).getHours();(h[k]=h[k]||{n:0,bad:0,d:0}).n++;if(A.status[i]==="bad")h[k].bad++;}
  if(A.stoppedAt)Object.keys(h).forEach(k=>{const a=new Date(A.t0);a.setHours(+k,0,0,0);const b=new Date(a.getTime()+3600000);
    const s=Math.max(a,A.stoppedAt,A.t0),e=Math.min(b,A.t1);const ov=Math.max(0,Math.round((e-s)/60000));
    if(A.stoppedAt>=a){h[k].bad=ov;}else if(ov>0)h[k].bad=Math.max(h[k].bad,ov);});
  A.disc.forEach(r=>{const k=r.t.getHours();if(h[k])h[k].d++;});
  const keys=Object.keys(h).map(Number).sort((a,b)=>a-b);
  $("hourTbl").innerHTML=`<thead><tr><th>ชั่วโมง</th><th>${esc(A.ch)}</th><th style="text-align:right">หลุด</th></tr></thead><tbody>`+
    keys.map(k=>{const o=h[k];const chip=o.bad===0?'<span class="chip g">ปกติ</span>':o.bad>=o.n-1?'<span class="chip c">ไม่มีภาพ</span>':`<span class="chip c">ไม่มีภาพ ${o.bad} นาที</span>`;
      return `<tr><td class="t">${pad(k)}:00</td><td>${chip}</td><td class="num">${o.d||"–"}</td></tr>`;}).join("")+"</tbody>";
}

function renderInfo(A){
  const kv=o=>o.filter(x=>x[1]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  $("camInfo").innerHTML=kv([["IP",A.ip],["รุ่น",A.info.model],["เฟิร์มแวร์",A.info.fw],["S/N",A.info.sn],["บันทึกล่าสุด",A.stoppedAt?hms(A.stoppedAt)+" น.":""]])||"<dt>-</dt><dd>ไม่มีข้อมูล</dd>";
  const sm=[...ROWS].reverse().find(r=>r.sub.includes("S.M.A.R.T"));
  if(sm){
    const g=re=>(re.exec(sm.d)||[])[1];
    const col=name=>g(new RegExp(name+"\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+(\\d+)","i"));
    const hours=col("Power-on Hours Count"),temp=col("temperature"),realloc=col("Reallocated Sector Count");
    const bad=/\s(FAIL|BAD)/i.test(sm.d);
    $("hddInfo").innerHTML=kv([["รุ่น",(g(/Model\s*=\s*(.*)/)||"").trim()],["ใช้งาน",hours?(hours/8760).toFixed(1)+" ปี":""],["อุณหภูมิ",temp?temp+" °C":""],["Sector เสีย",realloc],["S.M.A.R.T.",bad?"ผิดปกติ":"OK"]]);
  }else $("hddInfo").innerHTML="<dt>-</dt><dd>ไม่มีข้อมูล</dd>";
}

function renderOther(A){
  const camRe=new RegExp("หมายเลขกล้อง:\\s*"+A.n+"(\\D|$)");
  const skip=r=>r.sub==="ระบบทำงานอยู่"||r.sub.includes("S.M.A.R.T")||r.ch===A.ch||((r.sub.includes("ipc")||r.sub.includes("สถานะการเชื่อมต่อกล้อง"))&&(camRe.test(r.d)||!/หมายเลขกล้อง/.test(r.d)));
  const g={};
  ROWS.filter(r=>!skip(r)).forEach(r=>{const c=r.ch||(/กล้อง:\s*(D\d+)/.exec(r.d)||[])[1]||"";const k=r.sub+"|"+c+"|"+(r.user||"")+"|"+(r.ip||"");(g[k]=g[k]||[]).push(r);});
  const rows=Object.entries(g).sort((a,b)=>a[1][0].t-b[1][0].t);
  $("otherTbl").innerHTML=`<thead><tr><th>เหตุการณ์</th><th>ช่อง / ผู้ใช้</th><th>IP</th><th style="text-align:right">ครั้ง</th><th>เวลา</th></tr></thead><tbody>`+
    (rows.map(([k,v])=>{const [sub,ch,user,ip]=k.split("|");const a=v[0].t,b=v[v.length-1].t;
      return `<tr><td>${esc(sub)}</td><td>${esc([ch,user].filter(Boolean).join(" · ")||"-")}</td><td class="t">${esc(ip||"-")}</td><td class="num">${v.length}</td><td class="t">${hm(a)}${hm(a)!==hm(b)?"–"+hm(b):""}</td></tr>`;}).join("")||`<tr><td colspan="5">ไม่มี</td></tr>`)+"</tbody>";
}

/* ---------- wiring ---------- */
$("cam").addEventListener("change",e=>render(e.target.value));
function readFiles(list){
  const fs=[...list];
  if(!fs.length)return;
  $("pick").textContent="กำลังอ่าน…";
  const txt=f=>f.text?f.text():new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result));fr.onerror=no;fr.readAsText(f,"utf-8");});
  Promise.all(fs.map(f=>txt(f).then(t=>{const rows=parseCSV(t);const body=rows[0]&&/เวลา|time/i.test(rows[0][0])?rows.slice(1):rows;return {raw:body,n:body.length,name:f.name};})))
    .then(files=>{const m=mergeFiles(files);
      $("pick").textContent="เปิดไฟล์ Log (.csv)";
      if(!m.rows.length){$("vTitle").textContent="อ่านไฟล์ไม่ได้: ไม่พบรายการ log ในไฟล์ที่เลือก (ต้องเป็น CSV ที่ส่งออกจาก NVR)";return;}
      load(m.rows,m.meta,files.map(f=>f.name).join(", "));})
    .catch(()=>{$("pick").textContent="เปิดไฟล์ Log (.csv)";$("vTitle").textContent="อ่านไฟล์ไม่ได้ ลองเลือกไฟล์ใหม่อีกครั้ง";});
}
$("file").addEventListener("change",e=>{readFiles(e.target.files);e.target.value="";});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();readFiles(e.dataTransfer.files);});

const D=JSON.parse($("data").textContent);
load(D.rows.map(r=>{const p=parseTime(r[0]);return {t:p.t,sec:p.sec,main:r[1],sub:r[2],ch:r[3],user:r[4],ip:r[5],d:r[6]||""};}),D.meta,"Log.csv, Log_1.csv, Log_2.csv, Log_3.csv");
})();
</script>
